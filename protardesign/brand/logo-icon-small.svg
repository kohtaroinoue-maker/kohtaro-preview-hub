<?xml version="1.0" encoding="UTF-8"?>
<!--
  ProtarDesign — small / robust logo icon (32px 以下用)
  ============================================================
  目的: 白地グラデ文字版は小サイズでコントラストが落ちて薄く読めない。
        その対処として、小サイズ専用の堅牢版を用意。

  小サイズ版で変えた点（logo-icon.svg との差分）:
    1. 文字色: グラデ(#g-text) → 濃いティール単色 #007a91
       （グラデは縮小すると効果が消え、明るい側(#0099b2/#3fc0c4)が
         白地に溶ける。濃い単色にしてコントラストを最大化）
    2. ウェイト: Protar/Design とも 500 → 600（細りつぶれ対策）
    3. 字間: ほぼ 0 に詰める（小サイズで字が離れて読みにくくなるのを防ぐ）
    4. 文字サイズ: 17 → 18 にわずかに拡大し枠内をしっかり使う
    5. 罫線: 不透明・やや太め(stroke-width 1.4, 同色 #007a91)にして消えないように
    6. 枠線: 16px などでほぼ見えないため省略（白地＋微シャドウ無し）

  形・地・レイアウト（角丸スクエア／白地／2段左揃え／中央罫線）は据え置き。
  viewBox 100x100、width/height=128（小サイズ用の供給原寸）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 100 100" role="img" aria-label="ProtarDesign">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;display=swap');
      .pd-text-sm{font-family:"Fraunces",Georgia,serif;}
    </style>
  </defs>

  <!-- 角丸スクエア・白地 -->
  <rect x="0" y="0" width="100" height="100" rx="18" ry="18" fill="#ffffff"/>

  <!-- 2段・左揃え（濃いティール単色 / weight 600 / 字間ほぼ0） -->
  <text class="pd-text-sm" x="20" y="40.00" text-anchor="start" dominant-baseline="central"
        font-weight="600" font-size="18" letter-spacing="0" fill="#007a91">Protar</text>
  <text class="pd-text-sm" x="20" y="60.00" text-anchor="start" dominant-baseline="central"
        font-weight="600" font-size="18" letter-spacing="0" fill="#007a91">Design</text>

  <!-- 中央 区切り罫線（濃色・やや太め・不透明） -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#007a91" stroke-width="1.4" stroke-linecap="round"/>
</svg>
