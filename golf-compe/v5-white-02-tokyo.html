<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>07 — Tokyo Minimal</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pure: #ffffff;
    --bg: #fafaf8;
    --ink: #0c0c0a;
    --ink-2: #6a6a64;
    --hair: #e8e6df;
    --leaf: #5c8a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 400;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 460px; margin: 0 auto; padding: 48px 28px 130px; }

  .nav { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 80px; }
  .brand {
    font-family: 'Shippori Mincho', serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  .brand .dot { color: var(--leaf); }
  .nav-date { font-size: 10px; letter-spacing: 0.14em; color: var(--ink-2); font-weight: 500; font-feature-settings: "tnum"; }

  .hero { margin-bottom: 80px; }
  .hero-line {
    width: 24px; height: 1px;
    background: var(--leaf);
    margin-bottom: 24px;
  }
  .hero-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 36px;
    line-height: 1.4;
    letter-spacing: 0.04em;
    font-weight: 400;
  }
  .hero-title .small {
    display: block;
    font-size: 13px;
    margin-top: 18px;
    color: var(--ink-2);
    letter-spacing: 0.08em;
    line-height: 1.7;
    font-weight: 400;
  }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 80px; padding-top: 28px; border-top: 1px solid var(--hair); }
  .stat-label { font-size: 10px; letter-spacing: 0.2em; color: var(--ink-2); text-transform: uppercase; margin-bottom: 12px; font-weight: 500; }
  .stat-value {
    font-family: 'Shippori Mincho', serif;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1;
    font-feature-settings: "tnum";
  }
  .stat-delta { font-size: 11px; color: var(--ink-2); margin-top: 8px; font-weight: 400; }
  .stat-delta.leaf { color: var(--leaf); }

  .section-head { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: baseline; }
  .section-head .ttl { font-family: 'Shippori Mincho', serif; font-size: 18px; font-weight: 600; }
  .section-head .num { font-size: 11px; color: var(--ink-2); letter-spacing: 0.1em; font-feature-settings: "tnum"; }

  .card {
    display: grid;
    grid-template-columns: 1fr auto;
    padding: 22px 0;
    border-top: 1px solid var(--hair);
    cursor: pointer;
    align-items: center;
    transition: padding-left 0.3s ease;
    position: relative;
  }
  .card:last-of-type { border-bottom: 1px solid var(--hair); }
  .card:hover { padding-left: 14px; }
  .card:hover::before {
    content: '';
    position: absolute; left: 0; top: 22px; bottom: 22px;
    width: 1px;
    background: var(--leaf);
  }
  .card-title { font-family: 'Shippori Mincho', serif; font-size: 18px; font-weight: 600; letter-spacing: 0.02em; line-height: 1; }
  .card-meta { font-size: 11px; color: var(--ink-2); margin-top: 6px; letter-spacing: 0.04em; }
  .card-meta .sep { color: var(--leaf); margin: 0 6px; }
  .card-right { text-align: right; }
  .card-rank {
    font-family: 'Shippori Mincho', serif;
    font-size: 24px;
    font-weight: 400;
    line-height: 1;
    font-feature-settings: "tnum";
    letter-spacing: -0.01em;
  }
  .card-rank .total { color: var(--ink-2); font-size: 14px; }
  .card-date { font-size: 10px; color: var(--ink-2); margin-top: 4px; letter-spacing: 0.08em; font-feature-settings: "tnum"; }

  .footer-quote {
    margin-top: 80px;
    padding-top: 24px;
    border-top: 1px solid var(--hair);
    font-family: 'Shippori Mincho', serif;
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.7;
    text-align: center;
  }

  .fab {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--pure);
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 500;
    padding: 14px 28px;
    border: none; cursor: pointer;
    letter-spacing: 0.04em;
    border-radius: 0;
  }
  .fab:hover { background: var(--leaf); }

  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .nav, .hero, .stats, .section-head, .card, .footer-quote { animation: fade 0.7s both; }
  .hero { animation-delay: 0.08s; }
  .stats { animation-delay: 0.2s; }
  .section-head { animation-delay: 0.32s; }
  .card:nth-of-type(1) { animation-delay: 0.4s; }
  .card:nth-of-type(2) { animation-delay: 0.48s; }
  .card:nth-of-type(3) { animation-delay: 0.56s; }
</style>
</head>
<body>
<div class="shell">
  <div class="nav">
    <div class="brand">結<span class="dot">.</span></div>
    <div class="nav-date">2026.05.20</div>
  </div>

  <section class="hero">
    <div class="hero-line"></div>
    <h1 class="hero-title">
      朝の支度。
      <span class="small">三つの会、いずれも来月。<br>幹事の朝は、ひと夜の数字を見渡すことから。</span>
    </h1>
  </section>

  <div class="stats">
    <div>
      <div class="stat-label">Handicap</div>
      <div class="stat-value">12.4</div>
      <div class="stat-delta leaf">前回 −0.2</div>
    </div>
    <div>
      <div class="stat-label">Last Round</div>
      <div class="stat-value">89</div>
      <div class="stat-delta">+3 over par</div>
    </div>
  </div>

  <div class="section-head">
    <div class="ttl">所属する会</div>
    <div class="num">03 active</div>
  </div>

  <article class="card">
    <div>
      <div class="card-title">朝駆け会</div>
      <div class="card-meta">14名<span class="sep">·</span>5年目<span class="sep">·</span>↑2</div>
    </div>
    <div class="card-right">
      <div class="card-rank">3<span class="total">/14</span></div>
      <div class="card-date">04 / 12 · Course α</div>
    </div>
  </article>

  <article class="card">
    <div>
      <div class="card-title">ベイサイドクラブ</div>
      <div class="card-meta">8名<span class="sep">·</span>2年目<span class="sep">·</span>Premium</div>
    </div>
    <div class="card-right">
      <div class="card-rank">1<span class="total">/8</span></div>
      <div class="card-date">04 / 26 · Course β</div>
    </div>
  </article>

  <article class="card">
    <div>
      <div class="card-title">メトロオープン</div>
      <div class="card-meta">22名<span class="sep">·</span>8年目</div>
    </div>
    <div class="card-right">
      <div class="card-rank">11<span class="total">/22</span></div>
      <div class="card-date">05 / 03 · Course γ</div>
    </div>
  </article>

  <p class="footer-quote">朝のうちに、整える。</p>
</div>
<button class="fab">新しい会を結ぶ</button>
</body>
</html>
